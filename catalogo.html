        </ul>

  </nav>
  <!--fin navbar-->
  <!--titulo hero-->
  <div class="container my-5 bg-2">
    <div class="p-5 text-center">
      <h1 class="text-body-emphasis">Catalogo Te Lo Vendo</h1>
      <p class="lead">
      </p>
    </div>
  </div>
  <!--fin titulo hero-->
  <!--catalogo-->
  <div class="container-fluid text-center catalogo my-5">
    <div class="row row-cols-md-3 row-cols-lg-4 g-4" id="product-list">
      <!-- Aquí se generarán los productos del catálogo -->
    </div>
  </div>
  <!--fin catalogo-->
  <!-- tabla carrito-->
  <div class="container" id="cart-items">
    <!-- Tabla del carrito -->
  </div>
  <div class="container" id="cart-summary">
    <!-- Resumen del carrito -->
  </div>
<!-- Formulario de despacho -->
<div class="container my-5">
  <h2>Datos para el despacho</h2>
  <form id="formCompra">
    <div class="row g-3">
      <div class="col-md-6">
        <input class="form-control" type="text" id="nombre" placeholder="Nombre quien recibe" required />
      </div>
      <div class="col-md-6">
        <input class="form-control" type="text" id="direccion" placeholder="Dirección" required />
      </div>
      <div class="col-md-4">
        <input class="form-control" type="text" id="comuna" placeholder="Comuna" required />
      </div>
      <div class="col-md-4">
        <input class="form-control" type="text" id="region" placeholder="Región" required />
      </div>
      <div class="col-md-4">
        <input class="form-control" type="email" id="correo" placeholder="Correo electrónico" required />
      </div>
      <div class="col-12 text-end">
        <button type="submit" class="btn btn-primary">Confirmar Compra</button>
      </div>
    </div>
  </form>
</div>

<!-- Boleta -->
<div class="container my-5" id="boleta" style="display: none;">
  <h2>Boleta Electrónica</h2>
  <div id="detalleProductos"></div>
  <div id="resumenCompra" class="mt-3"></div>
  <div id="infoDespacho" class="mt-3"></div>
</div>
  <!--fin formulario despacho-->
  
  <!--footer bootstrap-->
  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top bg-1">

          derechos
          reservados</strong></span> </div>

            src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/500px-Instagram_icon.png"
            alt="LinkedIn" /></a></li>
      <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Facebook"><img width="50" height="50"

      <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Linkedin"><img width="50" height="50"
            src="https://upload.wikimedia.org/wikipedia/commons/8/81/LinkedIn_icon.svg" alt="LinkedIn" /></a></li>
    </ul>
  </footer>

    crossorigin="anonymous"></script>
  <script src="./assets/js/catalogo.js"></script>
